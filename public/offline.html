<!doctype html>
<html lang="bn">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#6D0F2B" />
    <title>ইন্টারনেট সংযোগ নেই | Alpa Zone BD</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px 16px;
        background: #fffcf8;
        color: #292526;
        font-family: 'Hind Siliguri', 'Noto Sans Bengali', system-ui, -apple-system, 'Segoe UI', sans-serif;
        text-align: center;
      }
      .card {
        width: 100%;
        max-width: 380px;
        padding: 36px 24px;
        background: #fff;
        border: 1px solid #e9e0d7;
        border-radius: 20px;
        box-shadow: 0 10px 30px rgba(53, 16, 28, 0.08);
      }
      img { width: 84px; height: 84px; border-radius: 50%; }
      .icon { margin: 20px auto 8px; color: #6d0f2b; }
      h1 { margin: 0 0 8px; font-size: 22px; color: #35101c; }
      p { margin: 0 0 24px; line-height: 1.6; color: #5c5254; }
      button {
        width: 100%;
        padding: 12px 20px;
        border: 0;
        border-radius: 999px;
        background: #6d0f2b;
        color: #fff;
        font: inherit;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
      }
      button:active { background: #35101c; }
    </style>
  </head>
  <body>
    <main class="card">
      <img src="/icons/icon-192.png" alt="Alpa Zone BD" />
      <svg class="icon" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M2 8.8a15 15 0 0 1 20 0M5 12.6a10 10 0 0 1 14 0M8.5 16.4a5 5 0 0 1 7 0M12 20h.01" />
        <path d="M3 3l18 18" />
      </svg>
      <h1>ইন্টারনেট সংযোগ নেই</h1>
      <p>আপনার ফোনের ইন্টারনেট বা Wi-Fi চালু আছে কিনা দেখে আবার চেষ্টা করুন। সংযোগ ফিরলে পেজটি নিজে থেকেই খুলে যাবে।</p>
      <button type="button" onclick="location.reload()">আবার চেষ্টা করুন</button>
    </main>
    <script>
      window.addEventListener('online', function () { location.reload(); });
    </script>
  </body>
</html>
